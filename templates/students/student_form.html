{% extends 'base.html' %}
{% load static %}

{% block title %}Nouvel Étudiant - Gestion d'École{% endblock %}

{% block content %}
<div class="student-form-page">
    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h2 mb-1">Nouvel Étudiant</h1>
            <p class="text-muted mb-0">Créer un nouvel étudiant</p>
        </div>
        <div>
            <a href="{% url 'students_list' %}" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left me-2"></i>Retour
            </a>
        </div>
    </div>

    <!-- Form -->
    <div class="row">
        <div class="col-md-10 mx-auto">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title mb-0">Informations de l'Étudiant</h5>
                </div>
                <div class="card-body">
                    <form method="POST" class="needs-validation" novalidate>
                        {% csrf_token %}

                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">Nom</label>
                                <input type="text" class="form-control" name="name"
                                       placeholder="KABORE" required>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">Prénom</label>
                                <input type="text" class="form-control" name="first_name"
                                       placeholder="Jean" required>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">Deuxième Prénom (optionnel)</label>
                                <input type="text" class="form-control" name="surname"
                                       placeholder="Baptiste">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Date de Naissance</label>
                                <input type="date" class="form-control" name="birth_date" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" name="email"
                                       placeholder="jean.kabore@student.bf">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Téléphone</label>
                                <input type="tel" class="form-control" name="phone"
                                       placeholder="+226 XX XX XX XX" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Adresse</label>
                                <input type="text" class="form-control" name="address"
                                       placeholder="Ouagadougou, Secteur 15" required>
                            </div>
                        </div>

                        <div class="mt-4 d-flex gap-2 justify-content-end">
                            <a href="{% url 'students_list' %}" class="btn btn-secondary">Annuler</a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-2"></i>Enregistrer
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
