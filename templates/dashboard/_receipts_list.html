<ul class="list-group list-group-flush">
{% for rec in recent_receipts %}
<li class="list-group-item px-3 py-2">
    <div class="d-flex justify-content-between align-items-start">
        <div>
            <div class="fw-semibold small">
                {{ rec.payment.student.name }} {{ rec.payment.student.first_name }}
            </div>
            <small class="text-muted">
                {{ rec.payment.fee_type.name }} —
                <a href="{% url 'receipt_view' rec.receipt_number %}" target="_blank">
                    {{ rec.receipt_number }}
                </a>
            </small>
        </div>
        <div class="text-end">
            <div class="text-success fw-semibold small">{{ rec.amount|floatformat:0 }} F</div>
            <small class="text-muted">{{ rec.issue_date|date:"d/m" }}</small>
        </div>
    </div>
</li>
{% empty %}
<li class="list-group-item text-center text-muted py-4">
    <i class="fas fa-receipt fa-2x mb-2 d-block"></i>
    Aucun reçu émis
</li>
{% endfor %}
</ul>
