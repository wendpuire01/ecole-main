<div class="mb-3">
    <label class="form-label fw-semibold">Nom <span class="text-danger">*</span></label>
    <input type="text" class="form-control" name="name" value="{{ obj.name|default:'' }}"
           placeholder="Ex: Frais de scolarité" required>
</div>
<div class="mb-3">
    <label class="form-label fw-semibold">Catégorie <span class="text-danger">*</span></label>
    <select class="form-select" name="category" required>
        {% for val, label in fee_type_categories %}
        <option value="{{ val }}" {% if obj.category == val %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
    </select>
</div>
<div class="mb-3">
    <label class="form-label fw-semibold">Description</label>
    <textarea class="form-control" name="description" rows="2">{{ obj.description|default:'' }}</textarea>
</div>
<div class="d-flex gap-4">
    <div class="form-check">
        <input class="form-check-input" type="checkbox" name="is_mandatory"
               id="mandatory_{{ obj.pk|default:'new' }}" {% if obj.is_mandatory or not obj.pk %}checked{% endif %}>
        <label class="form-check-label" for="mandatory_{{ obj.pk|default:'new' }}">Obligatoire</label>
    </div>
    {% if obj.pk %}
    <div class="form-check">
        <input class="form-check-input" type="checkbox" name="is_active"
               id="active_ft_{{ obj.pk }}" {% if obj.is_active %}checked{% endif %}>
        <label class="form-check-label" for="active_ft_{{ obj.pk }}">Actif</label>
    </div>
    {% endif %}
</div>
