{% extends 'base.html' %}
{% load static %}

{% block title %}Nouvelle Matière - Gestion d'École{% endblock %}

{% block content %}
<div class="subject-form-page">
    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h2 mb-1">Nouvelle Matière</h1>
            <p class="text-muted mb-0">Créer une nouvelle matière</p>
        </div>
        <div>
            <a href="{% url 'subjects_list' %}" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left me-2"></i>Retour
            </a>
        </div>
    </div>

    <!-- Form -->
    <div class="row">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title mb-0">Informations de la Matière</h5>
                </div>
                <div class="card-body">
                    <form method="POST" class="needs-validation" novalidate>
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">Nom de la Matière</label>
                            <input type="text" class="form-control" name="name"
                                   placeholder="Ex: Mathématiques" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Enseignant</label>
                            <select class="form-select" name="teacher">
                                <option value="">Sélectionner un enseignant</option>
                                {% for teacher in teachers %}
                                <option value="{{ teacher.id }}">
                                    {{ teacher.name }} {{ teacher.first_name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="d-flex gap-2 justify-content-end">
                            <a href="{% url 'subjects_list' %}" class="btn btn-secondary">Annuler</a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-2"></i>Enregistrer
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
