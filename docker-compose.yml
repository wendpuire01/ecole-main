version: '3.8'

# Version simplifiée — PostgreSQL + Django + WhiteNoise (sans Nginx/Redis/Celery)
# Idéal pour un déploiement simple en production

services:

  db:
    image: postgres:16-alpine
    container_name: ecole_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME:-ecole_db}
      POSTGRES_USER: ${DB_USER:-ecole_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ecole_user} -d ${DB_NAME:-ecole_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build: .
    container_name: ecole_web
    command: gunicorn school_manager.wsgi:application --bind 0.0.0.0:8000 --workers 2
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      USE_POSTGRES: "True"
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume:
