version: '3.8'

services:
  # Redis (pour Celery et cache - optionnel)
  redis:
    image: redis:7-alpine
    container_name: ecole_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application Django (avec SQLite)
  web:
    build: .
    container_name: ecole_web
    command: gunicorn school_manager.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - .:/app
      - db_volume:/app/db
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=django-insecure-change-this-in-production
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Celery Worker (optionnel - pour les tâches en arrière-plan)
  celery:
    build: .
    container_name: ecole_celery
    command: celery -A school_manager worker --loglevel=info
    volumes:
      - .:/app
      - db_volume:/app/db
    environment:
      - DEBUG=False
      - SECRET_KEY=django-insecure-change-this-in-production
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - web
    restart: unless-stopped

  # Celery Beat (optionnel - pour les tâches planifiées)
  celery-beat:
    build: .
    container_name: ecole_celery_beat
    command: celery -A school_manager beat --loglevel=info
    volumes:
      - .:/app
      - db_volume:/app/db
    environment:
      - DEBUG=False
      - SECRET_KEY=django-insecure-change-this-in-production
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - web
    restart: unless-stopped

  # Nginx (serveur web pour production)
  nginx:
    image: nginx:alpine
    container_name: ecole_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  db_volume:       # Volume pour la base de données SQLite
  static_volume:   # Volume pour les fichiers statiques
  media_volume:    # Volume pour les fichiers média
